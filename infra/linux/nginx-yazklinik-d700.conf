upstream yazklinik_d700 {
    server 127.0.0.1:5052;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 256m;

    location / {
        proxy_pass http://yazklinik_d700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

# TLS'i Nginx/Cloudflare tarafinda acacaksaniz ikinci server blogu ekleyin.
# Uygulama icindeki HTTPS listener Linux/Gunicorn modunda kapali tutulur.
