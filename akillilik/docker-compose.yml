# YazKlinik D700 Akillilik Stack (2026-05-17)
# 4 servis tek docker-compose'da:
#   - Vaultwarden     (parola yoneticisi)        https://localhost:18443
#   - Uptime Kuma     (servis saglik dashboard)  http://localhost:13001
#   - n8n             (workflow otomasyon)       http://localhost:15678
#   - Open WebUI      (Ollama profesyonel UI)    http://localhost:13000
#
# Kullanim:
#   cd D:\YazKlinik_Final_D300\akillilik
#   docker compose up -d
#   docker compose ps           # durum
#   docker compose logs -f n8n  # log
#   docker compose down         # durdur
#
# Tum data 'akillilik/data/' altina kalir; backup icin bu klasoru kopyalamak yeter.
# Portlari 1xxxx ile baslattik ki YazKlinik (5443) ve sistem portlariyla cakismasin.

services:
  # === 1) VAULTWARDEN (Bitwarden self-host) ==================================
  # Tum klinik parolalari (BulutKlinik, SGK, Voluson, Tailscale, NAS, ...)
  # tek vaultta sifreli sakla. Telefon + tarayici uzantisi ile her yerden erisim.
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: yk-vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=true       # ilk kullanici icin true, sonra false yap
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:-CHANGE_ME_RUN_INSTALL_SCRIPT}
      - DOMAIN=http://localhost:18443
      - SHOW_PASSWORD_HINT=false
    volumes:
      - ./data/vaultwarden:/data
    ports:
      - "18443:80"
      - "13012:3012"               # websocket

  # === 2) UPTIME KUMA (servis saglik) ========================================
  # Watch list:
  #   - https://127.0.0.1:5443/giris       (YazKlinik server)
  #   - http://127.0.0.1:11434/api/tags    (Ollama)
  #   - http://127.0.0.1:9000              (Whisper service)
  #   - https://176.236.92.142:65187       (Public Funnel)
  # Down olursa: discord/telegram/email push notification.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: yk-uptime-kuma
    restart: unless-stopped
    volumes:
      - ./data/uptime-kuma:/app/data
    ports:
      - "13001:3001"
    # Ozel: host network ile lokal portlari (5443, 11434) gorur
    # Windows Docker'da host network calismaz, host.docker.internal ile bagla

  # === 3) N8N (workflow otomasyon) ===========================================
  # YazKlinik webhook'larini al, WhatsApp/email/SMS/Telegram'a yonlendir.
  # Ornek workflowlar:
  #   - "Yeni randevu" -> 24h sonra hastaya WhatsApp hatirlatma
  #   - "Voluson PDF yeni" -> kontrol agirligi -> doktora telegram bildirim
  #   - "Gelmeyen hasta" -> ertesi gun otomatik yeniden ara
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: yk-n8n
    restart: unless-stopped
    user: "0:0"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:15678/
      - GENERIC_TIMEZONE=Europe/Istanbul
      - TZ=Europe/Istanbul
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=false    # localhost http icin
    volumes:
      - ./data/n8n:/home/node/.n8n
    ports:
      - "15678:5678"

  # === 4) OPEN WEBUI (Ollama profesyonel chat arayuzu) =======================
  # Ollama'daki tum modelleri ChatGPT-vari arayuzde dene.
  # Yaz model'i, qwen2.5:72b, meditron:70b ile direkt klinik soru-cevap.
  # Multi-modal (llama3.2-vision:11b) ile USG resmini gosterip soru sorabilirsin.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: yk-open-webui
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_AUTH=true            # giris zorunlu (multi-user destekli)
      - WEBUI_NAME=YazKlinik AI
      - WEBUI_URL=http://localhost:13000
      - ENABLE_SIGNUP=true         # ilk admin icin, sonra false
      - DEFAULT_USER_ROLE=user
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/open-webui:/app/backend/data
    ports:
      - "13000:8080"

  # === 5) OHIF VIEWER (DICOM viewer, klinik kalitesi) ========================
  # Voluson .dcm dosyalarini, MR/BT'yi profesyonel viewer ile incele.
  # WADO/DICOMweb destekler; Orthanc varsa otomatik bagla.
  ohif-viewer:
    image: ohif/app:v3.10.1
    container_name: yk-ohif
    restart: unless-stopped
    ports:
      - "13003:80"
    # Default config: USG goruntu test dataseti ile gelir.
    # Orthanc'a bagli icin ./data/ohif/app-config.js ekle (rehbere bak)

  # === 5b) POSTGRESQL (buyuk olcek SQLite alternatif) ========================
  # YazKlinik 10K+ hasta'da SQLite WAL kilitlenebilir. PG dayanikli scale.
  # Default sadece KURULU - YazKlinik SQLite'ta calismaya devam eder.
  # Migration manuel: yazklinik_postgres_agent.migrate_from_sqlite(dry_run=True)
  postgres:
    image: postgres:16-alpine
    container_name: yk-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=yazklinik
      - POSTGRES_USER=yazklinik
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-CHANGE_yk_pg}
      - POSTGRES_INITDB_ARGS=--locale=tr_TR.UTF-8 --encoding=UTF8
      - TZ=Europe/Istanbul
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yazklinik"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === 5c) REDIS (cache + queue) =============================================
  # sesli_onay kuyrugu, geri_cagirma scheduler, telesekreter triyaj cache,
  # Alex konusma session memory, rate limit.
  redis:
    image: redis:7-alpine
    container_name: yk-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-CHANGE_yk_redis}",
              "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru",
              "--save", "60", "1000"]
    volumes:
      - ./data/redis:/data
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_yk_redis}", "ping"]
      interval: 10s

  # === 5d) MEILISEARCH (instant full-text search) ============================
  # Hasta adi, protokol, gelis notu, USG raporu icin "Google-vari" anlik arama.
  # ChromaDB semantic disinda KESIN ESLESME (yazim hatasi tolere).
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: yk-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-CHANGE_yk_meili_master_key_min_16}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      - MEILI_DB_PATH=/meili_data/data.ms
    volumes:
      - ./data/meilisearch:/meili_data
    ports:
      - "17700:7700"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7700/health"]
      interval: 10s

  # === 6) STIRLING-PDF (PDF profesyonel araclar self-host) ===================
  # Merge, split, OCR (Tesseract), sign, redact, compress, watermark, password.
  # e-Nabiz PDF'leri + hasta dosyalari + reseteler icin tek nokta.
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: yk-stirling
    restart: unless-stopped
    environment:
      - DOCKER_ENABLE_SECURITY=true
      - SECURITY_ENABLELOGIN=true
      - SECURITY_INITIALLOGIN_USERNAME=admin
      - SECURITY_INITIALLOGIN_PASSWORD=${STIRLING_ADMIN_PASSWORD:-stirling-yk-CHANGE}
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=true
      - LANGS=tr_TR,en_US
      - SYSTEM_DEFAULTLOCALE=tr-TR
      - UI_APPNAME=YazKlinik PDF
    volumes:
      - ./data/stirling/configs:/configs
      - ./data/stirling/logs:/logs
      - ./data/stirling/customFiles:/customFiles
    ports:
      - "13004:8080"

# Tek bir bridge network. Servisler birbirini service-name ile bulur.
networks:
  default:
    name: yazklinik-akillilik

