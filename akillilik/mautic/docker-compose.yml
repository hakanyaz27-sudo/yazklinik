# Mautic - Email Marketing Automation (self-host)
# YazKlinik hasta hatirlatma + dogum gunu + saglik kampanyalari
#
# Kullanim:
#   cd D:\YazKlinik_Final_D300\akillilik\mautic
#   cp .env.example .env  # MYSQL_ROOT_PASSWORD ayarla
#   docker compose up -d
#   http://localhost:13005  -> Mautic ilk kurulum sihirbazi

services:
  mautic-db:
    image: mariadb:11
    container_name: yk-mautic-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-yk-mautic-CHANGE}
      - MYSQL_DATABASE=mautic
      - MYSQL_USER=mautic
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-yk-mautic-CHANGE}
    volumes:
      - ./data/db:/var/lib/mysql

  mautic:
    image: mautic/mautic:5
    container_name: yk-mautic
    restart: unless-stopped
    depends_on:
      - mautic-db
    environment:
      - MAUTIC_DB_HOST=mautic-db
      - MAUTIC_DB_USER=mautic
      - MAUTIC_DB_PASSWORD=${MYSQL_PASSWORD:-yk-mautic-CHANGE}
      - MAUTIC_DB_NAME=mautic
      - MAUTIC_RUN_CRON_JOBS=true
    volumes:
      - ./data/app:/var/www/html
    ports:
      - "13005:80"

networks:
  default:
    name: yazklinik-mautic
